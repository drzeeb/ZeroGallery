name: Publish

# Manually triggered, and deliberately separate from release.yml: cutting a release (bumping the
# version, building, signing, tagging) and *publishing* an already-built release to the Play Store
# are two entirely different concerns. This workflow does NOT build or sign anything itself - it
# downloads the exact .aab release.yml already built, signed and attached to that tag's GitHub
# Release, completely unmodified, and hands that file straight to fastlane. That's the whole point
# of splitting this out of release.yml: if the Play Store upload fails (a flaky Play Console API
# call, say), you re-run *this* against that very same already-signed artifact, as many times as
# needed - never rebuilding, never re-signing, never touching versioning again.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing release tag to publish, e.g. v1.2.0 - must already exist as a GitHub Release, see release.yml. The 'v' prefix is added automatically if you forget it."
        required: true
        type: string
      play_store_track:
        description: "Play Console track to upload to"
        required: false
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: resolve_ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT="${{ inputs.ref }}"
          if gh release view "$INPUT" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            RESOLVED="$INPUT"
          elif gh release view "v$INPUT" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            # Release tags are always created as "vX.Y.Z" (see release.yml) - forgetting the "v"
            # prefix (e.g. typing just "1.0.0") is an easy, common mistake, so it's resolved here
            # instead of failing outright.
            RESOLVED="v$INPUT"
          else
            echo "::error::No GitHub Release found for '$INPUT' or 'v$INPUT'. Did release.yml actually finish for this version?"
            exit 1
          fi
          echo "Resolved '$INPUT' -> '$RESOLVED'"
          echo "tag=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Download the already-built, already-signed bundle from that release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/build/outputs/bundle/release
          gh release download "${{ steps.resolve_ref.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "app-release.aab" \
            --dir app/build/outputs/bundle/release \
            --clobber

      - name: Set up Ruby (for fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Decode Play Console service account key
        run: |
          echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/play-store-key.json"
          echo "GOOGLE_PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play-store-key.json" >> "$GITHUB_ENV"

      - name: Upload to Play Store
        run: bundle exec fastlane android deploy track:${{ inputs.play_store_track }}

      - name: Remove decoded Play Console key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-store-key.json"

