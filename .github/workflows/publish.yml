name: Publish

# Manually triggered, and deliberately separate from release.yml: cutting a release (bumping the
# version, tagging, building) and *publishing* that already-built release to one or more targets
# (GitHub Release assets, the Play Store, ...) are two different concerns that can each fail for
# entirely unrelated reasons (a flaky Play Console API call vs. a Gradle build issue) - keeping them
# in one job would mean a single failing target fails the *whole* job, forcing you to re-cut an
# entirely new version (bumping versionCode again) just to retry the one thing that actually
# failed. This workflow instead re-checks-out an *existing* tag (already created by release.yml)
# and rebuilds from it, so it's freely and independently re-runnable per target, as many times as
# needed, without ever touching versioning again.
#
# Each target is its own opt-in boolean input, so a single run can publish to just one of them
# (e.g. only retry the Play Store upload that failed last time) or all of them at once.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing release tag (or branch/commit) to publish, e.g. v1.2.0 - must already exist, see release.yml. The 'v' prefix is added automatically if you forget it."
        required: true
        type: string
      bundle:
        description: "Attach the built .aab/.apk to this tag's GitHub Release (creates it if it doesn't exist yet)"
        required: false
        type: boolean
        default: true
      fastlane:
        description: "Upload the built .aab to the Play Store via fastlane (needs PLAY_STORE_UPLOAD_ENABLED + PLAY_STORE_JSON_KEY_BASE64, see README)"
        required: false
        type: boolean
        default: false
      play_store_track:
        description: "Play Console track to upload to, if the 'fastlane' option above is enabled"
        required: false
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve ref
        id: resolve_ref
        run: |
          INPUT="${{ inputs.ref }}"
          if git rev-parse --verify --quiet "refs/tags/$INPUT" > /dev/null || git rev-parse --verify --quiet "origin/$INPUT" > /dev/null || git rev-parse --verify --quiet "$INPUT^{commit}" > /dev/null 2>&1; then
            RESOLVED="$INPUT"
          elif git rev-parse --verify --quiet "refs/tags/v$INPUT" > /dev/null; then
            # Release tags are always created as "vX.Y.Z" (see release.yml) - forgetting the "v"
            # prefix (e.g. typing just "1.0.0") is an easy, common mistake, so it's resolved here
            # instead of failing the checkout outright.
            RESOLVED="v$INPUT"
          else
            echo "::error::No tag/branch/commit '$INPUT' (or 'v$INPUT') found. Existing tags:"
            git tag -l | sed 's/^/::error::  /'
            exit 1
          fi
          echo "Resolved '$INPUT' -> '$RESOLVED'"
          echo "ref=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ steps.resolve_ref.outputs.ref }}
        run: git checkout "${{ steps.resolve_ref.outputs.ref }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        if: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release bundle & APK
        run: ./gradlew bundleRelease assembleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Attach bundle & APK to GitHub Release
        if: ${{ inputs.bundle }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve_ref.outputs.ref }}
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk

      - name: Set up Ruby (for fastlane)
        if: ${{ inputs.fastlane }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Decode Play Console service account key
        if: ${{ inputs.fastlane }}
        run: |
          echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/play-store-key.json"
          echo "GOOGLE_PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play-store-key.json" >> "$GITHUB_ENV"

      - name: Upload to Play Store
        if: ${{ inputs.fastlane }}
        run: bundle exec fastlane android deploy track:${{ inputs.play_store_track }}

      - name: Remove decoded Play Console key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-store-key.json"

